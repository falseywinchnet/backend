name: Backend native bundles
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja ccache
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04's default Clang 18 rejects the existing in-class
          # friend exception specifications. Use the LLVM 22 release series.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache clang-22 generate-ninja pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libatk1.0-dev libatk-bridge2.0-dev xvfb xauth xdg-utils
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-ccache git
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Select Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orchestrator/target
          key: backend-rust-v1-${{ matrix.platform }}-${{ hashFiles('orchestrator/Cargo.lock') }}-${{ github.sha }}
          restore-keys: backend-rust-v1-${{ matrix.platform }}-${{ hashFiles('orchestrator/Cargo.lock') }}-
      - name: Test and package matching services
        run: python tools/build_bundle.py --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: |
            .build/${{ matrix.platform }}/backend-*.tar.gz
            .build/${{ matrix.platform }}/backend-*.sha256
          compression-level: 0
          retention-days: 30

  publish:
    needs: native
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          merge-multiple: true
          path: release-assets
      - name: Publish tested immutable build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_SHA}"
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
            --prerelease --title "$tag" \
            --notes "Tested build inputs for source $GITHUB_SHA. Native validation: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Not an application release or capability promotion."
